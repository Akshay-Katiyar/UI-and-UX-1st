<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UI and UX 1st — export & import partner moving India's finest goods to 60+ countries." />
    <meta name="theme-color" content="#06080f" />
    <script>
      // pick the theme before first paint: saved choice, else the device setting
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f2efe8' : '#06080f'
      })()
    </script>
    <link rel="preload" href="/land.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint (text shows in the fallback font, then swaps) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Newsreader:ital,opsz,wght@1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
    <title>UI and UX 1st — Global Export & Import</title>
    <style>html,body{background:#06080f;margin:0}#boot{z-index:101;color:#ece8df;background:#0b0f1a;flex-direction:column;justify-content:center;align-items:center;font-family:Archivo,ui-sans-serif,system-ui,sans-serif;display:flex;position:fixed;inset:0}#boot .k{letter-spacing:.3em;text-transform:uppercase;color:#8b91a1;font:11px/1 IBM Plex Mono,ui-monospace,monospace}#boot .n{letter-spacing:-.05em;margin-top:24px;font-size:clamp(4rem,14vw,10rem);font-weight:500;line-height:1}#boot .b{background:#ffffff1a;width:256px;height:1px;margin-top:24px;position:relative;overflow:hidden}#boot .b:after{content:"";background:#ff6b2c;width:30%;animation:1.1s ease-in-out infinite boot;position:absolute;inset:0}html[data-theme=light],html[data-theme=light] body{background:#f2efe8}html[data-theme=light] #boot{color:#15171d;background:#fbfaf7}html[data-theme=light] #boot .b{background:#0000001a}@keyframes boot{0%{transform:translate(-100%)}to{transform:translate(340%)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="k">Loading manifest</div><div class="n">000</div><div class="b"></div></div>
    <div id="root"></div>

  </body>
</html>
